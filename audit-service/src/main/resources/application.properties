spring.application.name=audit-service
spring.main.web-application-type=none

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=banco-auditoria
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

banco.kafka.topic.movimientos=banco.movimientos

auditoria.instancia=${AUDIT_INSTANCE:auditoria-1}
# Base de datos exclusiva del servicio de auditoria
spring.datasource.url=${AUDIT_DB_URL:jdbc:mysql://localhost:3307/banco_xyz_auditoria?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Confirmar offsets tras procesar cada registro
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
