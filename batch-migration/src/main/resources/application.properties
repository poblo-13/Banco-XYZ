spring.application.name=batch-migration
spring.main.web-application-type=none

# Base exclusiva para metadatos y resultados Batch
spring.datasource.url=${BATCH_DB_URL:jdbc:mysql://localhost:3307/banco_xyz_batch?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Repositorio de ejecuciones Spring Batch
spring.batch.jdbc.initialize-schema=always

# Los jobs se ejecutaran explicitamente durante las pruebas
spring.batch.job.enabled=false

# Datos financieros heredados
legacy.data.root=${LEGACY_DATA_ROOT:C:/Proyectos/fin_legacy_data/data}
