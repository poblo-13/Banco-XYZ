spring.application.name=bank-batch

# Conexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/bank_batch_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Batch
spring.batch.jdbc.initialize-schema=always

# Configuracion de procesamiento batch
batch.chunk-size=5
batch.core-pool-size=2
batch.max-pool-size=2
batch.queue-capacity=10
batch.max-skips=10

# Tolerancia a fallos transitorios
batch.retry-limit=3
batch.retry-initial-interval=500
batch.retry-multiplier=2.0
batch.retry-max-interval=2000

# Pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000