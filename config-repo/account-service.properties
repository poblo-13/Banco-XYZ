server.port=8084
banco.xyz.config.origen=Config Server Semana 9

# Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Actuator y monitoreo
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
# MySQL - Base de datos exclusiva de cuentas
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/banco_xyz_cuentas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA - Configuracion inicial de desarrollo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# OAuth2 - Validacion de tokens JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH_ISSUER_URI:http://authorization-server:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}