services:

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: banco_xyz_core
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - banco-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - banco-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    image: banco-xyz-config-server:semana8
    environment:
      CONFIG_REPO_LOCATION: file:/config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    ports:
      - "8888:8888"
    networks:
      - banco-net
    restart: on-failure

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    image: banco-xyz-discovery-server:semana8
    ports:
      - "8761:8761"
    networks:
      - banco-net
    restart: on-failure

  authorization-server:
    build:
      context: .
      dockerfile: authorization-server/Dockerfile
    image: banco-xyz-authorization-server:semana9
    environment:
      AUTH_ISSUER: http://authorization-server:9000
      OAUTH_WEB_CLIENT_SECRET: ${OAUTH_WEB_CLIENT_SECRET}
      OAUTH_MOBILE_CLIENT_SECRET: ${OAUTH_MOBILE_CLIENT_SECRET}
      OAUTH_ATM_CLIENT_SECRET: ${OAUTH_ATM_CLIENT_SECRET}
      OAUTH_BACKOFFICE_CLIENT_SECRET: ${OAUTH_BACKOFFICE_CLIENT_SECRET}
      OAUTH_PAYMENT_CLIENT_SECRET: ${OAUTH_PAYMENT_CLIENT_SECRET}
      OAUTH_OPERADOR_CLIENT_SECRET: ${OAUTH_OPERADOR_CLIENT_SECRET}
      OAUTH_ATM_INTERNAL_CLIENT_SECRET: ${OAUTH_ATM_INTERNAL_CLIENT_SECRET}
    ports:
      - "9000:9000"
    networks:
      - banco-net
    restart: on-failure

  bank-core-api:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: bank-core-api/Dockerfile
    image: banco-xyz-bank-core-api:semana8
    environment:
      CONFIG_SERVER_IMPORT: configserver:http://config-server:8888
      DB_URL: jdbc:mysql://mysql:3306/banco_xyz_core?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_URL: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
    networks:
      - banco-net
    restart: on-failure

  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    image: banco-xyz-account-service:semana9
    environment:
      CONFIG_SERVER_IMPORT: configserver:http://config-server:8888
      DB_URL: jdbc:mysql://mysql:3306/banco_xyz_cuentas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_URL: http://discovery-server:8761/eureka/
      OAUTH_ISSUER_URI: http://authorization-server:9000
      OAUTH_JWK_SET_URI: http://authorization-server:9000/oauth2/jwks
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_started
      authorization-server:
        condition: service_started
    networks:
      - banco-net
    restart: on-failure

  customer-service:
    build:
      context: .
      dockerfile: customer-service/Dockerfile
    image: banco-xyz-customer-service:semana9
    environment:
      CONFIG_SERVER_IMPORT: configserver:http://config-server:8888
      DB_URL: jdbc:mysql://mysql:3306/banco_xyz_clientes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_URL: http://discovery-server:8761/eureka/
      OAUTH_ISSUER_URI: http://authorization-server:9000
      OAUTH_JWK_SET_URI: http://authorization-server:9000/oauth2/jwks
    ports:
      - "8085:8085"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_started
      authorization-server:
        condition: service_started
    networks:
      - banco-net
    restart: on-failure

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    image: banco-xyz-payment-service:semana9
    environment:
      CONFIG_SERVER_IMPORT: configserver:http://config-server:8888
      DB_URL: jdbc:mysql://mysql:3306/banco_xyz_pagos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_URL: http://discovery-server:8761/eureka/
      OAUTH_ISSUER_URI: http://authorization-server:9000
      OAUTH_JWK_SET_URI: http://authorization-server:9000/oauth2/jwks
      OAUTH_PAYMENT_CLIENT_SECRET: ${OAUTH_PAYMENT_CLIENT_SECRET}
      ACCOUNT_SERVICE_URL: http://account-service:8084
      OAUTH_TOKEN_URL: http://authorization-server:9000/oauth2/token
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8086:8086"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      account-service:
        condition: service_started
      authorization-server:
        condition: service_started
    networks:
      - banco-net
    restart: on-failure

  bff-web:
    build:
      context: .
      dockerfile: bff-web/Dockerfile
    image: banco-xyz-bff-web:semana9
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:8084
      CUSTOMER_SERVICE_URL: http://customer-service:8085
      PAYMENT_SERVICE_URL: http://payment-service:8086
      OAUTH_ISSUER_URI: http://authorization-server:9000
      OAUTH_JWK_SET_URI: http://authorization-server:9000/oauth2/jwks
      SSL_ENABLED: "false"
    ports:
      - "8181:8081"
    depends_on:
      - account-service
      - customer-service
      - payment-service
      - authorization-server
    networks:
      - banco-net
    restart: on-failure

  bff-mobile:
    build:
      context: .
      dockerfile: bff-mobile/Dockerfile
    image: banco-xyz-bff-mobile:semana9
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:8084
      CUSTOMER_SERVICE_URL: http://customer-service:8085
      PAYMENT_SERVICE_URL: http://payment-service:8086
      OAUTH_ISSUER_URI: http://authorization-server:9000
      OAUTH_JWK_SET_URI: http://authorization-server:9000/oauth2/jwks
      SSL_ENABLED: "false"
    ports:
      - "8082:8082"
    depends_on:
      - account-service
      - customer-service
      - payment-service
      - authorization-server
    networks:
      - banco-net
    restart: on-failure

  bff-atm:
    build:
      context: .
      dockerfile: bff-atm/Dockerfile
    image: banco-xyz-bff-atm:semana9
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:8084
      CUSTOMER_SERVICE_URL: http://customer-service:8085
      PAYMENT_SERVICE_URL: http://payment-service:8086
      OAUTH_ISSUER_URI: http://authorization-server:9000
      OAUTH_JWK_SET_URI: http://authorization-server:9000/oauth2/jwks
      SSL_ENABLED: "false"
      OAUTH_TOKEN_URL: http://authorization-server:9000/oauth2/token
      OAUTH_ATM_INTERNAL_CLIENT_SECRET: ${OAUTH_ATM_INTERNAL_CLIENT_SECRET}
    ports:
      - "8083:8083"
    depends_on:
      - account-service
      - customer-service
      - payment-service
      - authorization-server
    networks:
      - banco-net
    restart: on-failure

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    image: banco-xyz-notification-service:semana9
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_DB_URL: jdbc:mysql://mysql:3306/banco_xyz_notificaciones?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - banco-net
    restart: on-failure

  risk-service:
    build:
      context: .
      dockerfile: risk-service/Dockerfile
    image: banco-xyz-risk-service:semana9
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_DB_URL: jdbc:mysql://mysql:3306/banco_xyz_riesgo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - banco-net
    restart: on-failure
  audit-service-1:
    build:
      context: .
      dockerfile: audit-service/Dockerfile
    image: banco-xyz-audit-service:semana9
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUDIT_INSTANCE: auditoria-1
      AUDIT_DB_URL: jdbc:mysql://mysql:3306/banco_xyz_auditoria?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - banco-net
    restart: on-failure

  audit-service-2:
    build:
      context: .
      dockerfile: audit-service/Dockerfile
    image: banco-xyz-audit-service:semana9
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUDIT_INSTANCE: auditoria-2
      AUDIT_DB_URL: jdbc:mysql://mysql:3306/banco_xyz_auditoria?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - banco-net
    restart: on-failure

networks:
  banco-net:
    driver: bridge

volumes:
  mysql-data:
  kafka-data: